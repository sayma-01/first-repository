<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping App</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <i class="ri-menu-2-line"></i>
            <i class="carticon ri-shopping-bag-2-fill"></i>
            <div class="cartexpnd"></div>
        </div>

        <div class="input-section">
            <input id="search" type="text" placeholder="search">
            <button class="filter-btn"><i class="ri-equalizer-fill"></i></button>
        </div>

        <div class="categories">

            <div class="icon active">
                <i class="ri-home-2-line"></i>
            </div>
            <div class="icon">
                <i class="ri-scroll-to-bottom-line"></i>
            </div>
            <div class="icon">
                <i class="ri-store-2-line"></i>
            </div>
            <div class="icon">
                <i class="ri-bookmark-line"></i>
            </div>
            <div class="icon">
                <i class="ri-global-line"></i>
            </div>
            <div class="icon">
                <i class="ri-service-line"></i>
            </div>
            <div class="icon">
                <i class="ri-home-2-fill"></i>
            </div>
        </div>
<div class="products"></div>
        <div class="popular-section">
            <h3>Popular</h3>
            <div class="populars">
               <div class="popular"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-left">
                <i class="ri-home-2-fill active"></i>
                <i class="ri-heart-fill"></i>
            </div>
            <i class="footer-center ri-shopping-bag-fill"></i>
            <div class="footer-right">
                <i class="ri-settings-fill"></i>
                <i class="ri-user-fill"></i>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
